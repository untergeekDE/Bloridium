[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bloridium"
version = "0.1.0"
description = "Utilities zum Uebertragen von Synth-Programmen vom Waldorf Blofeld auf den Waldorf Iridium"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bloridium = "bloridium.cli:main"

[tool.setuptools]
packages = ["bloridium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
