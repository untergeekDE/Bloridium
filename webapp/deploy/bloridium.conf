# /etc/apache2/sites-available/bloridium.conf  –  bloridium.frankruft.de
#
# Voraussetzung: DNS A-Record bloridium.frankruft.de -> Server-IP, Container
# laeuft auf 127.0.0.1:8000 (webapp/bloridium-web.service).
#
#   sudo cp webapp/deploy/bloridium.conf /etc/apache2/sites-available/
#   sudo a2ensite bloridium
#   sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d bloridium.frankruft.de
#
# certbot legt den :443-vhost als bloridium-le-ssl.conf an und kopiert die
# Direktiven unten mit (Proxy, Limit, Header) – danach kurz pruefen.
# Keine WebSockets noetig (reines HTTP/Form-Upload, gunicorn).

<VirtualHost *:80>
    ServerName bloridium.frankruft.de

    ProxyPreserveHost On
    ProxyPass /.well-known/ !
    ProxyPass        / http://127.0.0.1:8000/ timeout=130
    ProxyPassReverse / http://127.0.0.1:8000/

    # App-Limit ist MAX_UPLOAD_MB=8; Apache etwas grosszuegiger, damit die App
    # die freundliche 413-Seite liefert statt Apache.
    LimitRequestBody 10485760

    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=15768000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/bloridium_error.log
    CustomLog ${APACHE_LOG_DIR}/bloridium_access.log combined
</VirtualHost>
