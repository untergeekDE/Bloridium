# Podman-Compose (Debian-Server), aus dem Repo-Root:
#   podman compose -f webapp/compose.yaml up -d --build
# (funktioniert auch mit podman-compose; docker compose geht damit weiterhin)
services:
  bloridium-web:
    build:
      context: ..
      dockerfile: webapp/Containerfile
    image: localhost/bloridium-web:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data                  # Upload artifacts (ZIPs/reports), persistent
      - ../models:/app/models:ro      # RF prognosis model (gitignored in repo)
    environment:
      DATA_DIR: /data
      DATA_TTL_HOURS: "24"            # delete artifacts after 24 h
      BLORIDIUM_MODEL: /app/models/prognose_rf.pkl
    restart: unless-stopped
